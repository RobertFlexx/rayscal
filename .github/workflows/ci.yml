name: CI

on:
  push:
  pull_request:

jobs:
  ubuntu:
    name: Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            lld \
            cmake \
            git \
            libasound2-dev \
            libgl1-mesa-dev \
            libgl1-mesa-dri \
            libglu1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            pkg-config \
            xvfb
          clang --version
          # Scala Native 0.5.12 recommends LLVM/Clang 16+; fail early if older.
          clang_major="$(clang -dumpversion | cut -d. -f1)"
          if [ "${clang_major}" -lt 16 ]; then
            echo "Clang ${clang_major} is below the recommended minimum of 16" >&2
            exit 1
          fi

      - name: Build raylib
        run: |
          git clone --depth 1 --branch 6.0 https://github.com/raysan5/raylib.git /tmp/raylib
          cmake -B /tmp/raylib/build -S /tmp/raylib -DBUILD_SHARED_LIBS=ON -DBUILD_EXAMPLES=OFF
          cmake --build /tmp/raylib/build --parallel 2
          sudo cmake --install /tmp/raylib/build
          sudo ldconfig

      - name: Public API FFI safety check
        run: ./.github/check-ffi-safety.sh

      # abiCheck/run needs a display; headless runners provide one via Xvfb.
      - name: Validate bindings and link examples
        run: xvfb-run -a sbt check
